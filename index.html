<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ride Fare Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            margin: 0 0 10px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<header>
    <h1>🚖 Smart Ride Fare Prediction</h1>
    <p>Estimate your ride cost instantly</p>
</header>

<div class="container">
    <div class="card">

        <h2>Enter Ride Details</h2>

        <label>Distance (km)</label>
        <input type="number" id="distance" placeholder="Enter distance">

        <label>Time (minutes)</label>
        <input type="number" id="time" placeholder="Enter time">

        <button onclick="predictFare()">Predict Fare</button>

        <div class="result" id="result"></div>

    </div>
</div>

<script>
    function predictFare() {
        let distance = document.getElementById("distance").value;
        let time = document.getElementById("time").value;

        if (distance === "" || time === "") {
            document.getElementById("result").innerText = "Please enter all fields";
            return;
        }

        // Simple formula (you can replace with ML later)
        let fare = (distance * 10) + (time * 2);

        document.getElementById("result").innerText =
            "Estimated Fare: ₹ " + fare.toFixed(2);
    }
</script>

</body>
</html>
